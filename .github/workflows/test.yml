name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Centred movsum tests
        run: python -m pytest tests/test_wcs_centered_window.py -q --tb=short
      - name: Import the Streamlit entry point
        run: |
          python -c "
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('src').resolve()))
          import app
          "
      - name: Window performance
        run: |
          python -c "
          import time
          import numpy as np
          import sys
          sys.path.append('src')
          from wcs_analysis import calculate_wcs_period_rolling
          velocity = np.random.default_rng(0).normal(5.0, 1.0, 6000)
          started = time.perf_counter()
          distance, _, start, end = calculate_wcs_period_rolling(velocity, 0.5, 10, 0.0, 100.0)
          elapsed = time.perf_counter() - started
          assert end > start
          assert distance > 0
          assert elapsed < 2.0, elapsed
          print(f'30 s window in {elapsed:.3f}s, distance {distance:.1f} m')
          "
